plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - vendor/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Max: 150
  Exclude:
    - spec/**/*
RSpec/LeakyLocalVariable:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - pidgely.gemspec
Metrics/MethodLength:
  Max: 40
Metrics/AbcSize:
  Max: 45
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 15
Metrics/ParameterLists:
  Max: 7
Naming/PredicateMethod:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/NestedGroups:
  Max: 4
RSpec/DescribeClass:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false
